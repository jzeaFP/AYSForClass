<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 320px; background: #0f172a; color: white; font-family: sans-serif; padding: 15px; }
        .brand { color: #22d3ee; font-weight: bold; font-size: 18px; margin-bottom: 10px; display: block; }
        .budget-card { background: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .progress-container { background: #334155; height: 8px; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: #ef4444; width: 115%; height: 100%; } /* Shows over budget */
        .price { font-size: 24px; color: #22d3ee; font-weight: bold; margin: 10px 0; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-buy { background: #38bdf8; color: #0f172a; }
        .btn-save { background: #10b981; color: white; margin-top: 10px; }
        #nudgeBox, #successBox { display: none; text-align: center; }
        .warning-text { color: #f87171; font-size: 13px; margin-bottom: 15px; }
        .timer-btn { background: #334155; color: #94a3b8; font-size: 11px; margin-top: 8px; cursor: not-allowed; }
    </style>
</head>
<body>
    <span class="brand">AYS Funding</span>
    
    <div id="mainView">
        <div class="budget-card">
            <div style="display: flex; justify-content: space-between; font-size: 12px;">
                <span>Monthly Budget</span>
                <span style="color: #f87171;">-$45.99 Over</span>
            </div>
            <div class="progress-container"><div class="progress-bar"></div></div>
        </div>
        <div style="text-align: center;">
            <p style="margin: 0; color: #94a3b8;">Shopping Cart: Nike Dunk Low</p>
            <div class="price">$120.00</div>
            <button id="buyBtn" class="btn-buy">COMPLETE PURCHASE</button>
        </div>
    </div>

    <div id="nudgeBox">
        <h2 style="color: #f87171; margin-bottom: 5px;">Wait! 🛑</h2>
        <p class="warning-text">This purchase will delay your "New Car" savings goal by 3 weeks.</p>
        <button id="saveBtn" class="btn-save">ADD $120 TO SAVINGS INSTEAD</button>
        <button id="anywayBtn" class="timer-btn" disabled>Proceed Anyway (<span id="timer">5</span>s)</button>
    </div>

    <div id="successBox">
        <h2 style="color: #10b981;">Smart Move! 🎉</h2>
        <p style="font-size: 14px; color: #94a3b8;">We've moved $120 to your "New Car" fund. You're now 85% of the way there!</p>
        <button onclick="window.close()" style="background: #334155; color: white;">Close Tool</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
